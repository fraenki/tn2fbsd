# Placeholders in {braces} are filled with str.format by the calling generator.

[migration]
intro = "Generated by tn2fbsd. The files under this directory are ready for a recent FreeBSD system. Copy each file to the path shown below (the path is relative to `/`), then apply the manual steps in order."
ownership_intro = "Set owner, group and mode on the target system:"
users_intro = "Run after the groups above. The password hash is read from stdin and stored verbatim."

[zfs]
intro = "Import the TrueNAS pools before starting any service. TrueNAS mounted them under /mnt using a non-persistent altroot; the commands below make /mnt persistent so the paths used by the shares keep working. Run `zpool import` first to list the importable pools."
verify = 'Verify the resulting mountpoints with `zfs get -r mountpoint <pool>`. With `zfs_enable="YES"` (set in the generated rc.conf) the pools auto-import from the cachefile on subsequent boots. Do not run `zpool upgrade` unless you are sure the pools no longer need to be imported on the original system.'
encrypted = "Pools {pools} use legacy GELI encryption: attach the GELI providers with their key/passphrase before importing."

[tunables]
renamed_intro = "Already written to the generated files under the new name with the original value; no action needed."
removed_intro = "No longer available on newer FreeBSD versions. Review the values to decide whether they still matter."
boot_only = "{oid} (value {value}) cannot be set from sysctl.conf on newer FreeBSD; set it in /boot/loader.conf if the value is still required."

[notes]
ssh_host_keys = "SSH: the TrueNAS host keys were migrated to /etc/ssh so the server keeps its identity. Their ownership/mode is listed above."
ssh_authorized_keys_present = "SSH: root's authorized_keys was migrated to /root/.ssh/authorized_keys (ensure /root/.ssh is mode 0700). Needed when remotes SSH in as root by key, e.g. zettarepl replicating into this system."
ssh_authorized_keys_absent = "SSH: root's authorized_keys is not in the export (it is included only when 'Export authorized_keys for root' is enabled when saving the config). If remotes SSH in as root by key (e.g. zettarepl replicating into this system), copy /root/.ssh/authorized_keys manually. Non-root users' authorized_keys reside in their home directories and come with the pool."
ssh_enabled = "SSH: the base-system sshd is enabled (sshd_enable) instead of the ports OpenSSH (openssh_enable). Review /etc/ssh/sshd_config before starting sshd."
cron = "Cron jobs: the enabled TrueNAS cron jobs were written to {path}. On FreeBSD cron(8) runs them directly as the listed user; review the commands and their paths before enabling cron."
scrub = "ZFS scrub: FreeBSD's periodic(8) scrub runs daily and only starts a scrub once the per-pool threshold (days) has elapsed. The original per-task cron schedule is not preserved."
zettarepl = "zettarepl: install the [zettarepl port/package](https://bugs.freebsd.org/bugzilla/show_bug.cgi?id=298860), then enable the service with `sysrc zettarepl_enable=YES` and start it with `service zettarepl start`."
zettarepl_secret = "zettarepl.yaml contains private SSH key material; keep it mode 0600."
smb_install = "SMB: install the Samba package with `pkg install samba423`. The generated rc.conf already enables the service (samba_server_enable); start it with `service samba_server start`."
smb = "SMB: share sections were generated from the configuration database. TrueNAS-specific VFS modules were omitted for stock FreeBSD samba. If a share relies on exact TrueNAS behaviour, copy the original /var/db/system/samba4/registry.tdb and set 'registry shares = yes' / 'include = registry' in smb4.conf instead."
loader_unknown_drivers = "Network drivers with no known loader module: {drivers}. If such an interface does not appear on FreeBSD, add its kernel module to /boot/loader.conf.local (see the driver's manpage for the <module>_load name)."
overprovision = "SLOG over-provisioning was set to {size} GiB (System -> Advanced, 'LOG (Write Cache) Overprovision Size'). Existing log (SLOG) devices keep it through the pool import. When adding a new SLOG SSD on FreeBSD, first limit its usable capacity to {size} GiB (TrueNAS used disk_resize, which is not part of base FreeBSD; use a smaller GPT partition or a host capacity limit via camcontrol(8)/nvmecontrol(8))."
extra_pools = "Pools referenced by shares or home directories but absent from the TrueNAS pool list: {pools}. Import them the same way as the pools above if they still exist."
smb_auth = "SMB authentication: users {names} were SMB users on TrueNAS. After creating the Unix users, add each to the Samba passdb with `smbpasswd -a <user>` (this sets a new SMB password; the Unix account must already exist)."
pkg_install = "Install the required packages with pkg; use the exact package name from the service-specific notes above (for example Samba and zettarepl)."
